  <style>
    html, body { background: #0B0E12; margin: 0; }
    .sk { padding: max(56px, env(safe-area-inset-top)) 16px 0; display: grid; gap: 14px; max-width: 560px; margin: 0 auto; }
    .sk i { display: block; border-radius: 20px; background: #121821; animation: skp 1.5s ease-in-out infinite; }
    .sk .a { height: 34px; width: 46%; border-radius: 10px; }
    .sk .b { height: 150px; }
    .sk .c { height: 84px; animation-delay: .15s; }
    .sk .d { height: 84px; animation-delay: .3s; }
    .sk .e { height: 84px; animation-delay: .45s; }
    @keyframes skp { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sk i { animation: none; } }
    /* snímka obrazovky Dnes z minulého otvorenia: vidno ju hneď, ťukať sa dá až na čerstvú verziu (lišta funguje hneď) */
    html.fw-snap #app .screen { pointer-events: none; }
    /* prepínanie obrazoviek: tenký pásik hore a stlmená stará obrazovka, ak načítanie trvá dlhšie než chvíľku */
    html.fw-loading::after { content: ''; position: fixed; z-index: 200; left: 0; right: 0; top: env(safe-area-inset-top); height: 2.5px; pointer-events: none;
      background: linear-gradient(90deg, transparent, #7CFFB2, #3FD5C4, transparent) no-repeat; background-size: 45% 100%; opacity: 0;
      animation: fwin .2s 160ms forwards, fwbar 1.1s linear infinite; }
    html.fw-loading:not(.fw-snap) #app > .screen { opacity: .55; transition: opacity .2s ease 160ms; }
    @keyframes fwin { to { opacity: 1; } }
    @keyframes fwbar { from { background-position: -60% 0; } to { background-position: 160% 0; } }
    @media (prefers-reduced-motion: reduce) { html.fw-loading::after { animation: fwin .2s 160ms forwards; background-size: 100% 100%; } }
  </style>

  <script>
    // okamžitý štart: ak je používateľ prihlásený a appku dnes už otvoril, ukáže sa posledná obrazovka Dnes hneď,
    // ešte pred načítaním kódu a dát; čerstvé dáta ju o chvíľu nahradia
    (function () {
      try {
        var h = location.hash || '#/';
        if (h !== '#/' || !localStorage.getItem('sb-uxzwqyjbzkcveoxsdqdv-auth-token')) return;
        var s = JSON.parse(localStorage.getItem('fw_snap') || 'null');
        if (!s || !s.h || s.d !== new Date().toLocaleDateString('sv-SE')) return;
        document.getElementById('app').innerHTML = s.h;
        document.documentElement.classList.add('fw-snap', 'fw-loading');
      } catch (e) { /* bez snímky */ }
    })();
  </script>

    // bez približovania: ani dvojitým ťuknutím, ani roztiahnutím prstov (appka sa ovláda rýchlym ťukaním)
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  </script>
